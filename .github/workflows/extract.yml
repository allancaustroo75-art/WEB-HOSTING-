name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project.zip
        run: |
          mkdir -p extracted
          unzip -o project.zip -d extracted

          shopt -s dotglob nullglob

          # If ZIP contains a single top-level folder,
          # copy its contents to repository root
          entries=(extracted/*)

          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}/." .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f project.zip

      - name: Show extracted files
        run: |
          echo "Files after extraction:"
          find . -maxdepth 3 -type f | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Extract project.zip"
            git push
          fi
